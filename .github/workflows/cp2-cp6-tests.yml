name: CP2-CP8 Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pullback-engine-production
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pullbackengine/Pullback_Engine_v1_0_stage1/pullback_engine_v1_0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Compile and smoke-run CP7 launcher
        run: |
          python -m py_compile pullback_engine/cp7.py run_cp7.py
          set +e
          timeout 30s python run_cp7.py
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          echo "CP7 smoke run completed or reached the bounded smoke timeout (30s)."
      - name: Compile and run CP8 final audit
        run: |
          python -m py_compile pullback_engine/cp8.py run_cp8.py
          python run_cp8.py

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H 140.245.226.102 >> ~/.ssh/known_hosts
      - name: Deploy Pullback Engine and verify Psygrid contract
        run: |
          ssh -i ~/.ssh/oracle_key -o BatchMode=yes ubuntu@140.245.226.102 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR=/home/ubuntu/PullbackEngine
          SOURCE_DIR="$APP_DIR/Pullbackengine/Pullback_Engine_v1_0_stage1/pullback_engine_v1_0"
          REPO=https://github.com/zahidshaikmohammed-cmyk/pullback-psygrid.git

          if [ ! -d "$APP_DIR/.git" ]; then
            rm -rf "$APP_DIR"
            git clone "$REPO" "$APP_DIR"
          else
            git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" reset --hard origin/main
            git -C "$APP_DIR" clean -fd
          fi

          python3 -m venv "$APP_DIR/.venv"
          "$APP_DIR/.venv/bin/python" -m pip install --upgrade pip
          "$APP_DIR/.venv/bin/pip" install -r "$SOURCE_DIR/requirements.txt"

          curl -fsS --max-time 10 http://127.0.0.1:10000/public/live-a.json -o /tmp/pullback-psygrid-live-a.json
          curl -fsS --max-time 10 http://127.0.0.1:10000/public/nifty.json -o /tmp/pullback-psygrid-nifty.json
          curl -fsS --max-time 10 http://127.0.0.1:10000/ready -o /tmp/pullback-psygrid-ready.json
          "$APP_DIR/.venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          stocks = json.loads(Path('/tmp/pullback-psygrid-live-a.json').read_text())
          nifty = json.loads(Path('/tmp/pullback-psygrid-nifty.json').read_text())
          ready = json.loads(Path('/tmp/pullback-psygrid-ready.json').read_text())

          if nifty.get('symbol') != 'NIFTY':
              raise SystemExit('Psygrid NIFTY contract failed')

          if not isinstance(stocks.get('stocks'), dict):
              raise SystemExit('Psygrid live-a contract failed: stocks is not an object')

          stock_count = len(stocks['stocks'])
          session_status = ready.get('session_status')
          universe_size = ready.get('universe_size')
          service = ready.get('service')

          if stock_count == 45:
              print('Psygrid contract check: PASS (45-stock live shard + NIFTY)')
          elif session_status == 'CLOSED' and universe_size == 450 and service == 'PSYGRID':
              print('Psygrid contract check: PASS (market CLOSED; live shard correctly has 0 stocks)')
          else:
              raise SystemExit(
                  'Psygrid contract failed: '
                  f'live-a stocks={stock_count}, session_status={session_status!r}, '
                  f'universe_size={universe_size!r}, service={service!r}'
              )
          PY

          sudo cp "$SOURCE_DIR/deploy/pullback-engine.service" /etc/systemd/system/pullback-engine.service
          sudo systemctl daemon-reload
          sudo systemctl enable pullback-engine.service
          sudo systemctl restart pullback-engine.service
          sleep 3
          sudo systemctl is-active --quiet pullback-engine.service
          echo 'Pullback Engine service: ACTIVE'
          sudo systemctl --no-pager --full status pullback-engine.service | head -n 25
          REMOTE
