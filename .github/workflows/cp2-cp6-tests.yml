name: CP2-CP8 Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pullback-engine-production
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pullbackengine/Pullback_Engine_v1_0_stage1/pullback_engine_v1_0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Compile and smoke-run CP7 launcher
        run: |
          python -m py_compile pullback_engine/cp7.py run_cp7.py
          set +e
          timeout 30s python run_cp7.py
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          echo "CP7 smoke run completed or reached the bounded smoke timeout (30s)."
      - name: Compile and run CP8 final audit
        run: |
          python -m py_compile pullback_engine/cp8.py run_cp8.py
          python run_cp8.py

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H 140.245.226.102 >> ~/.ssh/known_hosts
      - name: Deploy Pullback Engine and verify Psygrid contract
        run: |
          ssh -i ~/.ssh/oracle_key -o BatchMode=yes ubuntu@140.245.226.102 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR=/home/ubuntu/PullbackEngine
          SOURCE_DIR="$APP_DIR/Pullbackengine/Pullback_Engine_v1_0_stage1/pullback_engine_v1_0"
          REPO=https://github.com/zahidshaikmohammed-cmyk/pullback-psygrid.git

          if [ ! -d "$APP_DIR/.git" ]; then
            rm -rf "$APP_DIR"
            git clone "$REPO" "$APP_DIR"
          else
            git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" reset --hard origin/main
            git -C "$APP_DIR" clean -fd
          fi

          python3 -m venv "$APP_DIR/.venv"
          "$APP_DIR/.venv/bin/python" -m pip install --upgrade pip
          "$APP_DIR/.venv/bin/pip" install -r "$SOURCE_DIR/requirements.txt"

          curl -sS --max-time 10 http://127.0.0.1:10000/ -o /tmp/pullback-psygrid-root.json
          curl -sS --max-time 10 http://127.0.0.1:10000/ready -o /tmp/pullback-psygrid-ready.json

          ROOT_SERVICE=$("$APP_DIR/.venv/bin/python" -c "import json; print(json.load(open('/tmp/pullback-psygrid-root.json')).get('service',''))")
          ROOT_UNIVERSE=$("$APP_DIR/.venv/bin/python" -c "import json; print(json.load(open('/tmp/pullback-psygrid-root.json')).get('universe_size',''))")
          READY_SERVICE=$("$APP_DIR/.venv/bin/python" -c "import json; print(json.load(open('/tmp/pullback-psygrid-ready.json')).get('service',''))")
          SESSION_STATUS=$("$APP_DIR/.venv/bin/python" -c "import json; print(json.load(open('/tmp/pullback-psygrid-ready.json')).get('session_status',''))")
          FEED_STATUS=$("$APP_DIR/.venv/bin/python" -c "import json; print(json.load(open('/tmp/pullback-psygrid-ready.json')).get('feed_status',''))")
          STOCK_COUNT=$("$APP_DIR/.venv/bin/python" -c "import json; print(json.load(open('/tmp/pullback-psygrid-ready.json')).get('stock_count',''))")
          SUBSCRIBED_COUNT=$("$APP_DIR/.venv/bin/python" -c "import json; print(json.load(open('/tmp/pullback-psygrid-ready.json')).get('subscribed_count',''))")

          if [ "$ROOT_SERVICE" != "PSYGRID" ]; then
            echo "Psygrid root contract failed: service=$ROOT_SERVICE"
            exit 1
          fi
          if [ "$ROOT_UNIVERSE" != "450" ]; then
            echo "Psygrid root contract failed: universe_size=$ROOT_UNIVERSE"
            exit 1
          fi
          if [ "$READY_SERVICE" != "PSYGRID" ]; then
            echo "Psygrid readiness failed: service=$READY_SERVICE"
            exit 1
          fi

          echo "Psygrid readiness: session=$SESSION_STATUS, feed=$FEED_STATUS, stocks=$STOCK_COUNT, subscribed=$SUBSCRIBED_COUNT"

          if [ "$SESSION_STATUS" = "CLOSED" ]; then
            echo "Psygrid contract check: PASS (market CLOSED; live endpoints are not required to contain live stocks)"
          else
            if [ "$STOCK_COUNT" != "450" ] || [ "$SUBSCRIBED_COUNT" != "450" ]; then
              echo "Psygrid readiness failed during live session: stock_count=$STOCK_COUNT, subscribed_count=$SUBSCRIBED_COUNT"
              exit 1
            fi
            curl -fsS --max-time 10 http://127.0.0.1:10000/public/live-a.json -o /tmp/pullback-psygrid-live-a.json
            curl -fsS --max-time 10 http://127.0.0.1:10000/public/nifty.json -o /tmp/pullback-psygrid-nifty.json
            "$APP_DIR/.venv/bin/python" -c "import json; s=json.load(open('/tmp/pullback-psygrid-live-a.json')); n=json.load(open('/tmp/pullback-psygrid-nifty.json')); assert isinstance(s.get('stocks'),dict), 'stocks is not an object'; assert len(s['stocks'])==45, f\"{len(s['stocks'])} stocks\"; assert n.get('symbol')=='NIFTY', 'NIFTY contract failed'; print('Psygrid contract check: PASS (45-stock live shard + NIFTY)')"
          fi

          sudo cp "$SOURCE_DIR/deploy/pullback-engine.service" /etc/systemd/system/pullback-engine.service
          sudo systemctl daemon-reload
          sudo systemctl enable pullback-engine.service

          echo '--- SYSTEMD UNIT ---'
          sudo systemctl cat pullback-engine.service

          echo '--- SYSTEMD VALIDATION ---'
          sudo systemd-analyze verify /etc/systemd/system/pullback-engine.service

          echo '--- STARTING PULLBACK ENGINE ---'
          if ! sudo systemctl restart pullback-engine.service; then
            echo '=== PULLBACK ENGINE START FAILED ==='
            sudo systemctl status pullback-engine.service --no-pager -l || true
            echo '=== SYSTEMD PROPERTIES ==='
            sudo systemctl show pullback-engine.service -p LoadState -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus -p ExecStart || true
            echo '=== JOURNAL ==='
            sudo journalctl -u pullback-engine.service -n 100 --no-pager || true
            exit 1
          fi

          sleep 3

          if ! sudo systemctl is-active --quiet pullback-engine.service; then
            echo '=== PULLBACK ENGINE INACTIVE AFTER RESTART ==='
            sudo systemctl status pullback-engine.service --no-pager -l || true
            echo '=== SYSTEMD PROPERTIES ==='
            sudo systemctl show pullback-engine.service -p LoadState -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus -p ExecStart || true
            echo '=== JOURNAL ==='
            sudo journalctl -u pullback-engine.service -n 100 --no-pager || true
            exit 1
          fi

          echo 'Pullback Engine service: ACTIVE'
          sudo systemctl --no-pager --full status pullback-engine.service | head -n 25
          REMOTE
