name: CP2-CP6 Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pullbackengine/Pullback_Engine_v1_0_stage1/pullback_engine_v1_0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CP2-CP6 tests
        run: python -m pytest -q test_cp2.py test_cp3.py test_cp4.py test_cp5.py test_cp6.py
